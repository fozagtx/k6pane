name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - uses: grafana/setup-k6-action@v1
      - name: Tests (unit + e2e against real k6)
        env:
          K6PANE_REQUIRE_K6: "1"
        run: pytest -v
