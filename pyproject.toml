# No [build-system], extras or dependency groups on purpose: Hermes treats such a pyproject as
# "installs nothing", so installing k6pane as a plugin never touches Hermes' Python environment.
# pip still builds it (PEP 517 legacy setuptools fallback) for `pip install git+...`.

[project]
name = "k6pane"
version = "0.3.0"
description = "Local k6 load testing plugin for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.entry-points."hermes_agent.plugins"]
k6pane = "k6pane"

[tool.setuptools]
packages = ["k6pane"]

[tool.setuptools.package-data]
k6pane = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider --import-mode=importlib"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
